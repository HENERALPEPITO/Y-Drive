<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pokémon Browser</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <header>
            <h1>🔴🟢🔵 Pokémon Browser</h1>
            <p>Explore the world of Pokémon</p>
        </header>

        <main>
            <div id="pokemon-list" class="pokemon-list">
                <div class="loading">Loading Pokémon...</div>
            </div>

            <div id="pagination" class="pagination">
                <!-- Pagination controls will be inserted here -->
            </div>

            <div id="pokemon-detail" class="pokemon-detail hidden">
                <!-- Pokemon details will be displayed here -->
            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
